# Builds BO1Ranked.exe and attaches it to the release whenever a tag like v0.8.0 is created.
# The app's version comes from the tag, so the tag is the only thing to choose when releasing.
#   v0.8.0          normal release, sent to every player
#   v0.8.0-beta.1   test version, sent only to players on the beta channel
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build standalone exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish app/BO1Ranked.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none `
            -p:Version=$version -o dist

      - name: Attach exe to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BO1Ranked.exe
          # A tag like v0.8.0-beta.1 is a test version: published as a pre-release, so only players
          # who ticked "Beta channel" in the app receive it.
          prerelease: ${{ contains(github.ref_name, '-beta') }}
